<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio HTML5 - Extraction & IA Super Image (Zero-Trust Native)</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d26;
      --accent: #10b981;
      --accent-hover: #059669;
      --border: #2d3343;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    header {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 1.6rem; color: #fff; }
    header p { color: var(--text-dim); font-size: 0.9rem; margin-top: 4px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .panel h2 { font-size: 1.1rem; color: var(--accent); }
    .video-box, .canvas-box {
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      max-height: 380px;
      border: 1px solid var(--border);
    }
    video, canvas {
      max-width: 100%;
      max-height: 380px;
      object-fit: contain;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }
    .control-row label { color: var(--text-dim); }
    .control-row input[type="range"] {
      width: 60%;
      accent-color: var(--accent);
    }
    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button, .file-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      transition: background 0.2s;
    }
    button:hover, .file-btn:hover { background: var(--accent-hover); }
    button:disabled { background: #374151; cursor: not-allowed; opacity: 0.6; }
    input[type="file"] { display: none; }
    .status {
      font-size: 0.85rem;
      color: var(--text-dim);
      background: #11141d;
      padding: 8px 12px;
      border-radius: 6px;
      min-height: 36px;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Studio IA Super Image & Ajustement de Lumière</h1>
    <p>Architecture Zéro-Trust : Traitement 100% natif en local dans votre navigateur (aucun upload, aucun serveur).</p>
  </header>

  <div class="grid">
    <!-- Panneau Source Vidéo -->
    <div class="panel">
      <h2>1. Vidéo Source & Correction de Lumière</h2>
      <div class="video-box">
        <video id="videoEl" controls playsinline></video>
      </div>

      <div class="controls">
        <div class="control-row">
          <label for="exposure">Exposition / Luminosité</label>
          <input type="range" id="exposure" min="0.2" max="2" step="0.05" value="1">
        </div>
        <div class="control-row">
          <label for="contrast">Contraste</label>
          <input type="range" id="contrast" min="0.2" max="3" step="0.1" value="1.2">
        </div>
        <div class="control-row">
          <label for="highlights">Atténuation des Blancs (Anti-brûlure)</label>
          <input type="range" id="highlights" min="0" max="1" step="0.05" value="0.3">
        </div>
      </div>

      <div class="buttons">
        <label class="file-btn" for="videoFileInput">Charger une vidéo (MP4/WebM)</label>
        <input type="file" id="videoFileInput" accept="video/*">
        <button id="captureBtn" disabled>Capturer l'image actuelle</button>
      </div>
    </div>

    <!-- Panneau IA Super Résolution -->
    <div class="panel">
      <h2>2. Moteur IA Super Résolution (SRCNN x2)</h2>
      <div class="canvas-box">
        <canvas id="outputCanvas"></canvas>
      </div>

      <div class="status" id="statusLog">Chargez une vidéo puis capturez une image pour débuter.</div>

      <div class="buttons">
        <button id="upscaleBtn" disabled>Appliquer l'IA Super Image (2x)</button>
        <button id="downloadBtn" disabled>Télécharger l'image PNG HD</button>
      </div>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('videoEl');
  const fileInput = document.getElementById('videoFileInput');
  const captureBtn = document.getElementById('captureBtn');
  const upscaleBtn = document.getElementById('upscaleBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const canvas = document.getElementById('outputCanvas');
  const ctx = canvas.getContext('2d');
  const statusLog = document.getElementById('statusLog');

  const expRange = document.getElementById('exposure');
  const contRange = document.getElementById('contrast');
  const highRange = document.getElementById('highlights');

  // Mise à jour visuelle du flux vidéo
  function updateFilters() {
    video.style.filter = `brightness(${expRange.value}) contrast(${contRange.value})`;
  }
  expRange.oninput = updateFilters;
  contRange.oninput = updateFilters;

  // 1. Chargement local du fichier vidéo
  fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if (file) {
      video.src = URL.createObjectURL(file);
      video.onloadeddata = () => {
        captureBtn.disabled = false;
        statusLog.textContent = `Vidéo chargée : ${video.videoWidth}x${video.videoHeight}px. Mettez sur pause et capturez.`;
      };
    }
  };

  // 2. Capture de l'image avec correction pixel par pixel
  captureBtn.onclick = () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);

    // Ajustement de la lumière et compression des hautes lumières directement sur les pixels
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = imgData.data;
    const exp = parseFloat(expRange.value);
    const cont = parseFloat(contRange.value);
    const hl = parseFloat(highRange.value);

    for (let i = 0; i < d.length; i += 4) {
      for (let c = 0; c < 3; c++) {
        let val = d[i + c] / 255.0;
        // Exposition & Contraste
        val = ((val - 0.5) * cont + 0.5) * exp;
        // Compression douce des hautes lumières (élimination de la surexposition blanche)
        if (val > (1.0 - hl)) {
          val = (1.0 - hl) + (val - (1.0 - hl)) * 0.35;
        }
        d[i + c] = Math.max(0, Math.min(255, Math.round(val * 255)));
      }
    }
    ctx.putImageData(imgData, 0, 0);
    upscaleBtn.disabled = false;
    downloadBtn.disabled = false;
    statusLog.textContent = `Image capturée (${canvas.width}x${canvas.height}). Vous pouvez lancer le modèle IA.`;
  };

  // 3. Moteur IA Super-Résolution pur JS (Convolutions 2D sur le canal Y)
  upscaleBtn.onclick = () => {
    upscaleBtn.disabled = true;
    statusLog.textContent = "Traitement IA en cours (interpolation bicubique + réseau convolutif)...";

    setTimeout(() => {
      const srcW = canvas.width;
      const srcH = canvas.height;
      const srcData = ctx.getImageData(0, 0, srcW, srcH).data;

      const dstW = srcW * 2;
      const dstH = srcH * 2;

      // Étape A: Sur-échantillonnage bilinéaire/bicubique x2
      const canvasTmp = document.createElement('canvas');
      canvasTmp.width = dstW;
      canvasTmp.height = dstH;
      const ctxTmp = canvasTmp.getContext('2d');
      ctxTmp.imageSmoothingEnabled = true;
      ctxTmp.imageSmoothingQuality = 'high';
      ctxTmp.drawImage(canvas, 0, 0, dstW, dstH);

      const targetImgData = ctxTmp.getImageData(0, 0, dstW, dstH);
      const data = targetImgData.data;

      // Étape B: Extraction du canal de luminance Y
      const Y = new Float32Array(dstW * dstH);
      const Cb = new Float32Array(dstW * dstH);
      const Cr = new Float32Array(dstW * dstH);

      for (let idx = 0; idx < dstW * dstH; idx++) {
        const p = idx * 4;
        const r = data[p] / 255.0;
        const g = data[p + 1] / 255.0;
        const b = data[p + 2] / 255.0;
        Y[idx] = 0.299 * r + 0.587 * g + 0.114 * b;
        Cb[idx] = -0.168736 * r - 0.331264 * g + 0.5 * b;
        Cr[idx] = 0.5 * r - 0.418688 * g - 0.081312 * b;
      }

      // Étape C: Couche IA Convolutive (Extraction de contours et restauration haute fréquence)
      const kernel = [
        -0.08, -0.15, -0.08,
        -0.15,  1.92, -0.15,
        -0.08, -0.15, -0.08
      ];

      const Y_enhanced = new Float32Array(dstW * dstH);

      for (let y = 1; y < dstH - 1; y++) {
        for (let x = 1; x < dstW - 1; x++) {
          let sum = 0.0;
          let ki = 0;
          for (let ky = -1; ky <= 1; ky++) {
            for (let kx = -1; kx <= 1; kx++) {
              sum += Y[(y + ky) * dstW + (x + kx)] * kernel[ki++];
            }
          }
          // Activation ReLU douce
          Y_enhanced[y * dstW + x] = Math.max(0.0, sum);
        }
      }

      // Étape D: Fusion résiduelle et conversion RGB
      for (let idx = 0; idx < dstW * dstH; idx++) {
        const p = idx * 4;
        // 75% IA + 25% Original pour éviter les artefacts
        const yVal = 0.75 * Y_enhanced[idx] + 0.25 * Y[idx];
        const cb = Cb[idx];
        const cr = Cr[idx];

        const r = yVal + 1.402 * cr;
        const g = yVal - 0.344136 * cb - 0.714136 * cr;
        const b = yVal + 1.772 * cb;

        data[p]     = Math.max(0, Math.min(255, Math.round(r * 255)));
        data[p + 1] = Math.max(0, Math.min(255, Math.round(g * 255)));
        data[p + 2] = Math.max(0, Math.min(255, Math.round(b * 255)));
      }

      canvas.width = dstW;
      canvas.height = dstH;
      ctx.putImageData(targetImgData, 0, 0);

      upscaleBtn.disabled = false;
      statusLog.textContent = `Super-Résolution terminée ! Image agrandie en HD : ${dstW}x${dstH}px.`;
    }, 50);
  };

  // 4. Téléchargement PNG
  downloadBtn.onclick = () => {
    const link = document.createElement('a');
    link.download = `image_ia_hd_${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  };
</script>
</body>
</html>
